      function formatDateTimeCL(dateInput = new Date()) {
        const d = dateInput instanceof Date ? dateInput : new Date(dateInput);
        const pad = (n) => String(n).padStart(2, '0');
        const hours24 = d.getHours();
        const period = hours24 >= 12 ? 'p. m.' : 'a. m.';
        const hours12 = hours24 % 12 || 12;
        return `${pad(d.getDate())}-${pad(d.getMonth() + 1)}-${d.getFullYear()}, ${hours12}:${pad(d.getMinutes())}:${pad(d.getSeconds())} ${period}`;
      }

      function toISODateString(dateInput = new Date()) {
        const d = dateInput instanceof Date ? dateInput : new Date(dateInput);
        const pad = (n) => String(n).padStart(2, '0');
        return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
      }

      function toTimeHHMM24(dateInput = new Date()) {
        const d = dateInput instanceof Date ? dateInput : new Date(dateInput);
        const pad = (n) => String(n).padStart(2, '0');
        return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
      }

      function buildTenMinuteSeries(baseInt = 34.2, baseExt = 24.8) {
        const now = new Date();
        now.setSeconds(0, 0);
        now.setMinutes(now.getMinutes() - (now.getMinutes() % 10));
        const pts = [];
        for (let i = 9; i >= 0; i--) {
          const t = new Date(now.getTime() - i * 10 * 60 * 1000);
          const label = `${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')}`;
          const w = Math.sin(i * 0.65) * 0.35;
          pts.push({
            time: label,
            interior: Number((baseInt + w).toFixed(1)),
            exterior: Number((baseExt + w * 0.7).toFixed(1)),
          });
        }
        return pts;
      }

      function evaluateTelemetryStatus(telemetry) {
        const { tempInterior, tempExterior, humedadExterior, estadoTapa, bateria } = telemetry;
        let tempStatus = 'NORMAL';
        if (tempInterior === null || tempInterior === undefined) tempStatus = 'NA';
        else if (Number(tempInterior) >= 36.1) tempStatus = 'HIGH_ALERT';
        else if (Number(tempInterior) < 15.0) tempStatus = 'LOW_BLINK_ALERT';

        const climaExteriorStatus =
          tempExterior === null || humedadExterior === null ? 'NA' : 'NORMAL';

        let tapaStatus = 'NORMAL';
        if (!estadoTapa || estadoTapa === 'N/A') tapaStatus = 'NA';
        else if (String(estadoTapa).toUpperCase() === 'ABIERTA') tapaStatus = 'OPEN_BLINK_ALERT';

        let bateriaStatus = 'NORMAL';
        if (bateria === null || bateria === undefined) bateriaStatus = 'NA';
        else if (Number(bateria) < 10.0) bateriaStatus = 'CRITICAL_BLINK_10';
        else if (Number(bateria) < 20.0) bateriaStatus = 'LOW_ALERT_20';

        const anySensorDisconnected =
          tempStatus === 'NA' || climaExteriorStatus === 'NA' || tapaStatus === 'NA' || bateriaStatus === 'NA';

        return { tempStatus, climaExteriorStatus, tapaStatus, bateriaStatus, anySensorDisconnected };
      }

      /* Gráfico SVG nativo para Escritorio con Eje X cada 10 min y Eje Y de 5 en 5 hasta 50°C */
      function TemperatureTrendSVG({ data, darkMode }) {
        const yTicks = [0, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50];
        const width = 860;
        const height = 320;
        const padLeft = 44;
        const padRight = 20;
        const padTop = 16;
        const padBottom = 34;
        const plotW = width - padLeft - padRight;
        const plotH = height - padTop - padBottom;

        const getX = (i) => padLeft + (i / Math.max(1, data.length - 1)) * plotW;
        const getY = (val) => padTop + plotH - (Math.max(0, Math.min(50, val)) / 50) * plotH;

        const intPoints = data.map((d, i) => `${getX(i)},${getY(d.interior)}`).join(' ');
        const extPoints = data.map((d, i) => `${getX(i)},${getY(d.exterior)}`).join(' ');
        const intArea = `${getX(0)},${getY(0)} ${intPoints} ${getX(data.length - 1)},${getY(0)}`;
        const extArea = `${getX(0)},${getY(0)} ${extPoints} ${getX(data.length - 1)},${getY(0)}`;

        return (
          <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-[270px] sm:h-[340px] overflow-visible">
            <defs>
              <linearGradient id="svgGradInt" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stopColor="#D99B26" stopOpacity="0.42" />
                <stop offset="100%" stopColor="#D99B26" stopOpacity="0.02" />
              </linearGradient>
              <linearGradient id="svgGradExt" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stopColor="#2A9D8F" stopOpacity="0.32" />
                <stop offset="100%" stopColor="#2A9D8F" stopOpacity="0.02" />
              </linearGradient>
            </defs>

            {yTicks.map((t) => {
              const y = getY(t);
              return (
                <g key={t}>
                  <line x1={padLeft} y1={y} x2={width - padRight} y2={y} stroke={darkMode ? '#1e293b' : '#f1f5f9'} strokeDasharray="3 3" />
                  <text x={padLeft - 10} y={y + 4} textAnchor="end" fontSize="11" fontWeight="600" fill={darkMode ? '#94a3b8' : '#64748b'}>
                    {t}°
                  </text>
                </g>
              );
            })}

            <polygon points={intArea} fill="url(#svgGradInt)" />
            <polygon points={extArea} fill="url(#svgGradExt)" />
            <polyline fill="none" stroke="#D99B26" strokeWidth="3.2" points={intPoints} />
            <polyline fill="none" stroke="#2A9D8F" strokeWidth="3.2" points={extPoints} />

            {data.map((d, i) => (
              <g key={d.time + i}>
                <circle cx={getX(i)} cy={getY(d.interior)} r="4" fill="#D99B26" stroke="#fff" strokeWidth="1.5" />
                <circle cx={getX(i)} cy={getY(d.exterior)} r="4" fill="#2A9D8F" stroke="#fff" strokeWidth="1.5" />
                <text x={getX(i)} y={height - 8} textAnchor="middle" fontSize="11" fontWeight="600" fill={darkMode ? '#94a3b8' : '#64748b'}>
                  {d.time}
                </text>
              </g>
            ))}
          </svg>
        );
      }

                            <div>
                              <span className="text-xs sm:text-sm font-extrabold text-[#122B52] dark:text-white block">
                                Filtrar por Rango Horario (Activación Manual)
                              </span>
                              <span className="text-[11px] text-slate-400">
                                {rangoHorarioActivo
                                  ? 'Filtro horario habilitado para acotar la consulta.'
                                  : 'Desactivado por defecto para optimizar el rendimiento de las consultas.'}
                              </span>
                            </div>
                          </div>

                          {rangoHorarioActivo && (
                            <div className="flex flex-wrap items-center gap-3 bg-slate-50 dark:bg-slate-800 p-2.5 rounded-xl border border-slate-200 dark:border-slate-700">
                              <div className="flex items-center gap-1.5">
                                <label className="text-xs font-bold">Hora Desde:</label>
                                <input
                                  type="time"
                                  value={horaDesde}
                                  onChange={(e) => setHoraDesde(e.target.value)}
                                  className="px-2 py-1 rounded-lg border text-xs font-bold dark:bg-slate-900"
                                />
                              </div>
                              <div className="flex items-center gap-1.5">
                                <label className="text-xs font-bold">Hora Hasta:</label>
                                <input
                                  type="time"
                                  value={horaHasta}
                                  onChange={(e) => setHoraHasta(e.target.value)}
                                  className="px-2 py-1 rounded-lg border text-xs font-bold dark:bg-slate-900"
                                />
                              </div>
                            </div>
                          )}
                        </div>
                      </div>

                      <div className="bg-white dark:bg-slate-900 rounded-2xl divide-y dark:divide-slate-800 border border-slate-100 dark:border-slate-800">
                        {filteredEvents.length === 0 ? (
                          <p className="p-8 text-center text-sm text-slate-400">Sin eventos registrados para los filtros seleccionados.</p>
                        ) : (
                          filteredEvents.map((ev) => (
                            <div key={ev.id} className="p-4 flex flex-wrap justify-between items-center gap-2">
                              <div>
                                <p className="font-extrabold text-sm text-[#122B52] dark:text-white">{ev.titulo} ({ev.tipoEvento})</p>
                                <p className="text-xs text-slate-500">{ev.detalle}</p>
                              </div>
                              <div className="text-xs font-semibold space-x-2">
                                <span className="px-2.5 py-1 rounded bg-slate-100 dark:bg-slate-800">Inicio: {ev.fechaInicio}</span>
                                <span className="px-2.5 py-1 rounded bg-emerald-50 dark:bg-emerald-950/50 text-emerald-700 dark:text-emerald-300">Término: {ev.fechaTermino}</span>
                              </div>
                            </div>
                          ))
                        )}
                      </div>
                    </div>
                  )}

                  {activeTab === 'cuenta' && (
                    <div className="max-w-3xl space-y-6">
                      <h1 className="text-2xl font-extrabold text-[#122B52] dark:text-white">Mi Perfil</h1>
                      <div className="bg-white dark:bg-slate-900 p-6 rounded-3xl flex flex-wrap items-center justify-between gap-4 border border-slate-100 dark:border-slate-800">
                        <div className="flex items-center gap-4">
                          {avatarUrl ? (
                            <img src={avatarUrl} className="w-20 h-20 rounded-full object-cover" />
                          ) : (
                            <div className="w-20 h-20 rounded-full bg-gradient-to-br from-[#122B52] to-[#2A9D8F] text-white flex items-center justify-center text-3xl font-extrabold">U</div>
                          )}
                          <div>
                            <h2 className="text-xl font-extrabold">Apicultor</h2>
                            <p className="text-xs text-slate-400 font-mono">ID: 15797764717598643303</p>
                            <span className="inline-block mt-1 px-3 py-0.5 rounded-full bg-emerald-50 text-emerald-700 text-xs font-bold">● Cuenta Activa y Sincronizada</span>
                          </div>
                        </div>
                        <label className="cursor-pointer px-4 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-bold">
                          Subir Avatar (Máx 600x600px)
                          <input
                            type="file"
                            accept="image/*"
                            className="hidden"
                            onChange={(e) => {
                              const f = e.target.files?.[0];
                              if (!f) return;
                              const r = new FileReader();
                              r.onload = (ev) => {
                                const img = new Image();
                                img.onload = () => {
                                  if (img.width > 600 || img.height > 600) {
                                    setUploadMsg(`Error: La imagen mide ${img.width}x${img.height}px (máximo 600x600px).`);
                                  } else {
                                    setAvatarUrl(ev.target.result);
                                    setUploadMsg(`Avatar actualizado (${img.width}x${img.height}px).`);
                                  }
                                };
                                img.src = ev.target.result;
                              };
                              r.readAsDataURL(f);
                            }}
                          />
                        </label>
                      </div>
                      {uploadMsg && <p className="text-xs font-bold text-amber-600">{uploadMsg}</p>}
                    </div>
                  )}
                </main>

                <footer className="w-full mt-auto bg-[#122B52] text-amber-400 px-6 py-4 flex flex-wrap items-center justify-between gap-2 text-xs font-extrabold">
                  <span>BeeSense 2026.</span>
                  <button
                    onClick={() => setShow404Page(true)}
                    className="px-3 py-1 rounded-full bg-white/10 hover:bg-white/20 text-amber-300 text-[11px] font-bold transition"
                  >
                    Probar Vista Error 404
                  </button>
                </footer>
              </div>

              {/* Modales */}
              {showLidModal && (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 p-4">
                  <div className="bg-white dark:bg-slate-900 rounded-3xl p-8 max-w-sm w-full text-center space-y-4">
                    <h2 className="text-xl font-extrabold text-[#122B52] dark:text-white">¡Alerta de Seguridad!</h2>
                    <p className="text-sm text-slate-600 dark:text-slate-300">Se ha detectado que la tapa del colmenar principal se encuentra <strong className="text-orange-600">ABIERTA</strong>.</p>
                    <button onClick={() => setShowLidModal(false)} className="w-full py-3 rounded-xl bg-[#122B52] text-white font-bold text-sm">Entendido</button>
                  </div>
                </div>
              )}
              {showBatteryModal && !showLidModal && (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 p-4">
                  <div className="bg-white dark:bg-slate-900 rounded-3xl p-8 max-w-sm w-full text-center space-y-4">
                    <h2 className="text-xl font-extrabold text-[#122B52] dark:text-white">¡Batería Crítica!</h2>
                    <p className="text-sm text-slate-600 dark:text-slate-300">El nivel de batería ha caído por debajo del <strong className="text-red-600">20%</strong>. Es necesario revisión y recarga en el colmenar.</p>
                    <button onClick={() => setShowBatteryModal(false)} className="w-full py-3 rounded-xl bg-red-500 text-white font-bold text-sm">Entendido</button>
                  </div>
                </div>
              )}
              {showLogoutModal && (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 p-4">
                  <div className="bg-white dark:bg-slate-900 rounded-3xl p-8 max-w-sm w-full text-center space-y-4">
                    <h2 className="text-xl font-extrabold">¿Confirmar cierre de sesión?</h2>
                    <div className="grid grid-cols-2 gap-3">
                      <button onClick={() => setShowLogoutModal(false)} className="py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 font-bold text-xs">Cancelar</button>
                      <button onClick={() => { setShowLogoutModal(false); setIsAuthenticated(false); }} className="py-2.5 rounded-xl bg-red-600 text-white font-bold text-xs">Cerrar Sesión</button>
                    </div>
                  </div>
                </div>
              )}
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
